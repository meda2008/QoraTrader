version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/qora_trader
      - TIMESCALEDB_URL=postgresql://user:password@timescale:5432/qora_trader
    depends_on:
      - db
      - timescale
    volumes:
      - ./backend:/app
    networks:
      - qora_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - qora_network

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=qora_trader
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qora_network

  timescale:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=qora_trader
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - qora_network

volumes:
  postgres_data:
  timescale_data:

networks:
  qora_network:
    driver: bridge