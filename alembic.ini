[alembic]
# path to migration scripts
script_location = db/migrations

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# max_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version number spacing.  defaults to 1
# spacing = 1

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. If this key is omitted entirely, it falls back to the legacy
# behavior of splitting on spaces and/or commas.
# Valid values for version_path_separator are:
#
# version_path_separator = :
# version_path_separator = ;
# version_path_separator = space
version_path_separator = os

# version locations are separated by spaces, by default.
# If this key is omitted entirely, it falls back to the legacy behavior
# of splitting on spaces and/or commas.
version_locations = db/migrations/versions

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = postgresql://qoratrader:qoratrader@localhost:5432/qoratrader


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are invoked
# by the 'alembic revision' command after a new revision script has been
# written.
# The 'exec' hook type is used to execute an external program.
# The 'console' hook type is used to run a named Python function
# within the 'alembic' command's environment.
#
# format is:
#   hook_type = directive
#
# hook_type may be one of:
#   exec: exec (optional) prog (optional) args...
#   console: console (required) name
#
# directive should be in the format of:
#  prog: (required) program name/path to execute
#  args: (optional) space-separated list of arguments to send to prog
#  name: (required) the name of a function to call
#
# example:
#   exec = python -m scripts.my_cool_migration
#   console = myapp.scripts.my_function
#
# hooks = my_hook
# my_hook.type = exec
# my_hook.prog = /usr/bin/python
# my_hook.args = package_name scripts.do_something.py


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S